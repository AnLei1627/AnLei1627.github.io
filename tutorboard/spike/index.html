<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ink spike</title>
    <style>html,body{background:#fff;height:100%;margin:0;font:13px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}#stage{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}#stage canvas{position:absolute;top:0;left:0}#hud{pointer-events:auto;background:#ffffffeb;border:1px solid #ddd;border-radius:8px;max-width:320px;padding:8px 10px;position:fixed;top:8px;left:8px}#hud label{margin-right:10px;display:inline-block}#hud pre{white-space:pre-wrap;color:#333;margin:6px 0 0;font-size:11px}#hud button{margin-right:6px}.row{margin-bottom:4px}</style>
    <script type="module" crossorigin src="/tutorboard/assets/spike-BVA_uvc8.js"></script>
    <link rel="modulepreload" crossorigin href="/tutorboard/assets/pointer-bOBtX2ym.js">
  </head>
  <body>
    <div id="stage">
      <canvas id="main"></canvas>
      <canvas id="live"></canvas>
    </div>
    <div id="hud">
      <div class="row">
        <label><input type="checkbox" id="coalesced" checked /> coalesced</label>
        <label><input type="checkbox" id="predicted" checked /> predicted</label>
        <label><input type="checkbox" id="desync" checked /> desynchronized</label>
      </div>
      <div class="row">
        <label>size <input type="range" id="size" min="1" max="12" step="0.5" value="4" /></label>
        <button id="clear">清除</button>
        <button id="undo">復原</button>
      </div>
      <pre id="stats"></pre>
    </div>
  </body>
</html>
